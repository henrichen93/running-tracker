name = "running-tracker-strava"
main = "worker.js"
compatibility_date = "2025-01-01"
account_id = "7be3a1285f1f9cae102287f272f77147"

[vars]
STRAVA_CLIENT_ID = "299733"
SITE_URL = "https://henrichen93.github.io/running-tracker/"
# Muốn tính cả hoạt động để chế độ "Chỉ mình tôi" thì đổi thành "read,activity:read_all"
STRAVA_SCOPE = "read,activity:read"
GH_REPO = "henrichen93/running-tracker"
GH_BRANCH = "main"

[[kv_namespaces]]
binding = "ATHLETES"
id = "3b9654d0b8e14786a29a9e6084ae4935"

# Kích hoạt sync đúng :00 :15 :30 :45 (giờ UTC; phút giống mọi múi giờ)
[triggers]
crons = ["0,15,30,45 * * * *"]

[observability]
enabled = true
