name: Sync Strava & Deploy

on:
  # Lịch chính: Cloudflare Worker cron gọi workflow_dispatch (mode=auto) đúng :00 :15 :30 :45.
  # Lịch dự phòng của GitHub (có thể trễ vài phút), để vẫn tự sync khi Worker cron lỗi:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = chỉ người có thay đổi, full = quét toàn bộ'
        required: false
        default: full
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: sync-deploy
  cancel-in-progress: false # lần sau xếp hàng chờ lần trước xong

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      stale: ${{ steps.stale.outputs.stale }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          case "${{ github.event_name }}/${{ inputs.mode }}" in
            push/*) node scripts/sync.mjs --recompute ;;
            workflow_dispatch/full) node scripts/sync.mjs --full ;;
            *) node scripts/sync.mjs ;;
          esac
      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Không có thay đổi"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync data $(date -u +%Y-%m-%dT%H:%MZ)"
            # Nếu main có commit mới (BTC sửa config / lần sync khác) thì rebase;
            # xung đột ở file dữ liệu sinh ra -> lấy main mới, giữ cache activities vừa tải, tính lại.
            for i in 1 2 3; do
              if git pull --rebase origin ${{ github.ref_name }} && git push; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Push/rebase lỗi (lần $i) -> tính lại trên main mới nhất"
              git rebase --abort 2>/dev/null || true
              rm -rf /tmp/acts && cp -r data/activities /tmp/acts
              git fetch origin ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
              mkdir -p data/activities && cp /tmp/acts/*.json data/activities/ 2>/dev/null || true
              node scripts/sync.mjs --recompute
              git add data
              if git diff --cached --quiet; then
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git commit -m "chore: sync data $(date -u +%Y-%m-%dT%H:%MZ)"
            done
            exit 1
          fi
      - name: Kiểm tra web có đang chạy bản mới nhất không
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Lần deploy trước lỗi (Pages hay lỗi tạm thời) thì web bị kẹt bản cũ -> deploy lại
          git fetch -q origin ${{ github.ref_name }}
          HEAD_SHA=$(git rev-parse origin/${{ github.ref_name }})
          LIVE=""
          for row in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=10" --jq '.[] | "\(.id),\(.sha)"'); do
            id=${row%,*}; sha=${row#*,}
            state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = "success" ]; then LIVE=$sha; break; fi
          done
          echo "HEAD=$HEAD_SHA LIVE=$LIVE"
          if [ "$LIVE" = "$HEAD_SHA" ]; then echo "stale=false" >> "$GITHUB_OUTPUT"; else echo "stale=true" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: sync
    # Sync tự động mà dữ liệu không đổi thì không deploy lại
    if: needs.sync.outputs.changed == 'true' || needs.sync.outputs.stale == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'auto')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Gắn phiên bản vào đường dẫn JS/CSS (tránh trình duyệt dùng file cũ)
        run: |
          V=$(git rev-parse --short HEAD)
          sed -i "s/__V__/$V/g" index.html admin.html assets/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Chờ rồi thử deploy lại
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deployment
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
